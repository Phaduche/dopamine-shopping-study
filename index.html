<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>담아마켓 · 연구용 모의 쇼핑</title>
    <meta name="description" content="KSEF 연구용 모의 쇼핑 애플리케이션 (실제 쇼핑몰 아님 / 실제 결제·배송 없음)" />
    <!-- GitHub Pages SPA 폴백 복원 (404.html이 인코딩한 경로를 되돌림). 루트 ?cond=&pid= 는 건드리지 않음 -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
