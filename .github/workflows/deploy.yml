name: Deploy to GitHub Pages

# 로컬 전용 운영 요청에 따라 자동 배포는 비활성화(수동 실행만 가능).
# 나중에 웹 배포가 필요하면 아래 push 트리거 주석을 해제하면 됩니다.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build (base = /<repo>/)
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
