# main 에 push 되면 mockgap/ 과 ordertrace/ 만 GitHub Pages 로 배포한다.
# 쇼핑 데모(shop/)와 서버, 참가자 기록은 배포하지 않는다.
# mockgap 은 data/ 의 SAMPLE 자료로 data.js 를 만들어 넣는다 (실제 문항은 공개하지 않는다).
name: Deploy participant pages

on:
  push:
    branches: [main]
    paths: ["mockgap/**", "ordertrace/**", "site/**", "server.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          rm -rf mockgap/data_local            # 혹시 있어도 공개하지 않는다
          python3 mockgap/build_local.py
          mkdir -p _site
          cp site/index.html site/researcher.html _site/
          cp -r mockgap/local_bundle _site/mockgap
          mkdir -p _site/ordertrace
          cp ordertrace/index.html ordertrace/task.js ordertrace/style.css _site/ordertrace/
          cp -r ordertrace/stimuli _site/ordertrace/stimuli
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
