<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 경험 연구 참여</title>
<link rel="stylesheet" href="survey.css">
</head>
<body>
<div class="wrap">
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card"></div>
</div>
<script src="survey-config.js"></script>
<script src="survey.js"></script>
<script>
// 흐름: 동의 → 기본 정보 → (서버가 조건 배정) → 쇼핑 → 설문(survey.html)
const card = document.getElementById("card"), bar = document.getElementById("bar");
const TOTAL_STEPS = PRE_SURVEY.length + 1 + POST_SURVEY.length; // 진행 막대용
const STEPS = `<div class="steps"><b>① 기본 정보</b> › ② 쇼핑 › ③ 설문</div>`;

function intro() {
  bar.style.width = "4%";
  card.innerHTML = `<h1>쇼핑 경험 연구에 참여해 주셔서 감사합니다</h1>
    <div class="desc">기본 정보(1분) → 쇼핑 화면 둘러보기 → 짧은 설문(2~3분) 순서로 진행됩니다.</div>
    <div class="notice"><ul>
      <li>이름·연락처·계정 정보는 수집하지 않으며, 응답은 무작위 연구 ID로만 저장됩니다.</li>
      <li>쇼핑 화면에서의 행동(화면 이동, 장바구니 등)이 연구용으로 기록될 수 있습니다.</li>
      <li>언제든 참여를 그만둘 수 있으며, 그만두어도 불이익은 없습니다.</li>
    </ul></div>
    <label class="agree"><input type="checkbox" id="agree"> 위 내용을 읽었고 연구 참여에 동의합니다.</label>
    <div class="err" id="err"></div>
    <div class="nav"><span></span><button id="next">시작</button></div>`;
  document.getElementById("next").onclick = () => {
    if (!document.getElementById("agree").checked) return document.getElementById("err").textContent = "동의에 체크해 주세요.";
    pre();
  };
}

function pre() {
  runSurvey({
    sections: PRE_SURVEY, card, bar, stepTotal: TOTAL_STEPS, submitLabel: "쇼핑 화면으로",
    onSubmit: async answers => {
      const r = await fetch("/api/start", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers: { consent: "yes", ...answers, submitted_at: new Date().toISOString() } }) });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      try { localStorage.setItem("study-pid", d.pid); } catch {}
      shopping(d);
    },
  });
  card.insertAdjacentHTML("afterbegin", STEPS);
}

// 쇼핑은 새 탭에서 열고, 이 탭은 "설문 시작" 버튼을 들고 기다린다.
// (조건 1은 외부 사이트라 돌아올 길이 없으므로 두 조건 모두 같은 방식으로 맞춘다)
function shopping(d) {
  bar.style.width = `${((PRE_SURVEY.length + 1) / (TOTAL_STEPS + 1)) * 100}%`;
  const surveyUrl = `survey.html?pid=${encodeURIComponent(d.pid)}`;
  const shopUrl = d.condition === 0 ? `${d.redirect}?pid=${encodeURIComponent(d.pid)}` : d.redirect;
  card.innerHTML = `<div class="steps">① 기본 정보 › <b>② 쇼핑</b> › ③ 설문</div>
    <h1>쇼핑 화면을 둘러봐 주세요</h1>
    <div class="desc">연구 ID <b>${d.pid}</b></div>
    <div class="notice"><ul>
      <li>아래 버튼을 누르면 쇼핑 화면이 <b>새 탭</b>에서 열립니다. 평소처럼 자유롭게 둘러보세요.</li>
      <li>장바구니에 담거나 주문해도 됩니다. (데모 화면은 실제 결제·배송이 없습니다)</li>
      <li>다 보셨으면 <b>이 탭으로 돌아와</b> "설문 시작" 버튼을 눌러 주세요.</li>
    </ul></div>
    <button class="big" id="open">쇼핑 화면 열기 ↗</button>
    <div class="nav" style="margin-top:14px"><span></span><button id="toSurvey" disabled>쇼핑을 마쳤어요 · 설문 시작</button></div>
    <div class="err" id="err"></div>`;
  const openBtn = document.getElementById("open"), next = document.getElementById("toSurvey");
  openBtn.onclick = () => {
    const w = window.open(shopUrl, "_blank");
    if (!w) { document.getElementById("err").textContent = "팝업이 차단되었어요. 주소창 옆 차단 아이콘에서 허용해 주세요."; return; }
    fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ pid: d.pid, type: "shop_opened", detail: { condition: d.condition } }) }).catch(() => {});
    openBtn.textContent = "쇼핑 화면 다시 열기 ↗"; openBtn.classList.add("ghost");
    next.disabled = false;
  };
  next.onclick = () => location.href = surveyUrl;
}

intro();
</script>
</body>
</html>
